stages:
- sync
- build

sync-from-github:
  stage: sync
  image: alpine/git:v2.52.0
  rules:
  - if: $CI_PIPELINE_SOURCE == "schedule"
  - if: $CI_PIPELINE_SOURCE == "web"
  script:
  - git config user.email "ci-gitlab@onetag-gitlab.crserv.net"
  - git config user.name "ci-gitlab"
  - git remote add github https://github.com/Onetag-team/amazon-eks-pod-identity-webhook.git
  - git fetch github
  - git checkout -B master github/master
  - git checkout -B custom-onetag-code github/custom-onetag-code
  - git remote add ci_origin https://oauth2:$CI_COMMIT_TOKEN@onetag-gitlab.crserv.net/infrastructure/amazon-eks-pod-identity.git
  - git push ci_origin --force 'refs/heads/*:refs/heads/*' 'refs/tags/*:refs/tags/*'

build-image-dev:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.9.0-debug
    entrypoint: [ "" ]
  before_script:
  - mkdir -p /kaniko/.docker
  - echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"auth\":\"$(echo -n $DOCKER_USER:$DOCKER_PASSWORD | base64)\"}}}" > /kaniko/.docker/config.json
  script:
  - /kaniko/executor --context "${BUILD_PATH}" --dockerfile "${BUILD_PATH}/Dockerfile" --destination "${IMAGE_NAME}:${IMAGE_TAG}"
  variables:
    BUILD_PATH: ${CI_PROJECT_DIR}
    IMAGE_NAME: fquaglia/aws-pod-identity-webhook
    IMAGE_TAG: ${CI_COMMIT_SHORT_SHA}
  rules:
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: never
  - if: $CI_COMMIT_TAG
    when: never
  - if: $CI_COMMIT_BRANCH
    when: on_success

build-image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.9.0-debug
    entrypoint: [ "" ]
  script:
  - /kaniko/executor --context "${BUILD_PATH}" --dockerfile "${BUILD_PATH}/Dockerfile" --destination "${IMAGE_NAME}:${IMAGE_TAG}" --insecure
  variables:
    BUILD_PATH: ${CI_PROJECT_DIR}
    IMAGE_NAME: registry.docker/${CI_PROJECT_NAME}-webhook
    IMAGE_TAG: ${CI_COMMIT_TAG}
  only:
  - tags
