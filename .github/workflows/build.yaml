name: build

on: push

jobs:
  build:
    # Rimosso il lock su 'aws/amazon-eks-pod-identity-webhook'
    if: github.repository == 'Onetag-team/amazon-eks-pod-identity-webhook'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write # necessario per GHCR

    steps:
    - uses: actions/checkout@v3

    - name: Setup Go Version
      run: echo "GO_VERSION=$(cat .go-version)" >> $GITHUB_ENV

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v3
      with:
        version: latest

    # --- Opzione A: GitHub Container Registry (zero config) ---
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push to GHCR
      run: |
        BRANCH=$(echo $GITHUB_REF | cut -d'/' -f3)
        SHORT_SHA=$(echo $GITHUB_SHA | cut -c -7)
        REPO=ghcr.io/onetag-team/amazon-eks-pod-identity-webhook

        if [ "$BRANCH" = "master" ]; then
          TAG=$SHORT_SHA
        else
          TAG=$BRANCH-$SHORT_SHA
        fi

        docker buildx build \
          -t $REPO:$TAG \
          --build-arg golang_image=public.ecr.aws/eks-distro-build-tooling/golang:${{ env.GO_VERSION }}-gcc \
          --platform=linux/amd64,linux/arm64 \
          --progress plain \
          --push .

        if [ "$BRANCH" = "master" ]; then
          docker buildx build \
            -t $REPO:latest \
            --build-arg golang_image=public.ecr.aws/eks-distro-build-tooling/golang:${{ env.GO_VERSION }}-gcc \
            --platform=linux/amd64,linux/arm64 \
            --progress plain \
            --push .
        fi
